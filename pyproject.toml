[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-fps"
version = "0.6.0"
description = "Fast farthest point sampling for PyTorch (Triton on CUDA, JIT C++ on CPU, pure-PyTorch fallback)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Felix Yu" },
]
requires-python = ">=3.9"
dependencies = [
    "torch>=2.7",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/felixyu7/torch-fps"

[tool.setuptools]
packages = ["torch_fps"]

# C++ sources for the CPU backend, compiled just-in-time on first use (not at
# install time, so the wheel stays pure-Python)
[tool.setuptools.package-data]
torch_fps = ["csrc/*.cpp"]
